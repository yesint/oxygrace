[package]
name = "oxygrace-cli"
description = "Headless command-line renderer for Grace (.agr/.xvg) plot files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The installed command is `oxygrace`, like the library it wraps.
[[bin]]
name = "oxygrace"
path = "src/main.rs"

[dependencies]
oxygrace = { path = "../oxygrace" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
