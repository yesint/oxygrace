<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Oxygrace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Trunk builds the wasm from this crate; see README section "Web". -->
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #202020;
        }
        canvas {
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="oxygrace_canvas"></canvas>
</body>
</html>
