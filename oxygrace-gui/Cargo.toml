[package]
name = "oxygrace-gui"
description = "Interactive GUI editor for Grace (.agr) plot files, built on the oxygrace renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oxygrace = { path = "../oxygrace" }
# persistence: settings (Edit → Settings…) survive restarts, natively and
# in the browser (localStorage).
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
egui_extras = "0.34"
# The dark/light looks are data: `themes/*.toml` style sheets (a parent egui
# preset plus overrides) applied by this app-independent crate of ours
# (repo: github.com/yesint/egui-stylesheet). The sheets are shared with
# molar_vis, so the two applications look like one family. To develop the two
# together, temporarily add
#   [patch.crates-io]
#   egui-stylesheet = { path = "../../egui-stylesheet" }
# to the workspace root and don't commit it.
egui-stylesheet = "0.1"
tiny-skia = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# Toolbar icons: embedded Phosphor symbolic icon font (crisp at any DPI,
# tinted by the current text color, identical on native and wasm).
egui-phosphor = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native file dialogs only; the web build drives the file input directly.
rfd = "0.15"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }
