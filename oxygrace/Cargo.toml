[package]
name = "oxygrace"
description = "A pure-Rust headless interpreter and renderer for Grace (.agr/.xvg) plot files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
peg = "0.8"
tiny-skia = "0.11"
ttf-parser = "0.25"
png = "0.17"
log = "0.4"
# The native .oxgr format: RON documents with serde-derived schema structs.
serde = { version = "1", features = ["derive"] }
ron = "0.10"
