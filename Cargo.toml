# Virtual workspace: the core library, the headless CLI renderer and the
# interactive GUI editor.
[workspace]
members = ["oxygrace", "oxygrace-cli", "oxygrace-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yesint/oxygrace"
