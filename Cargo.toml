[package]
name = "oxygrace"
version = "0.1.0"
edition = "2021"
description = "A pure-Rust headless interpreter and renderer for Grace (.agr/.xvg) plot files"
license = "GPL-2.0-or-later"

[lib]
name = "oxygrace"
path = "src/lib.rs"

[[bin]]
name = "oxygrace"
path = "src/main.rs"

[dependencies]
peg = "0.8"
tiny-skia = "0.11"
ttf-parser = "0.25"
png = "0.17"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
